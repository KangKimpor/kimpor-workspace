version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # shortcut: TypeScript 7 lacks the compiler API; revisit when lint tooling supports it.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      development:
        dependency-type: development
      runtime:
        dependency-type: production
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
