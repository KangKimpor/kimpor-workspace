name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    # 138 app cases, 18 auth cases and 510 pixel comparisons retain every gate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:build
      - name: Verify reproducible dashboard deployment bundles
        run: |
          pnpm cloud:dashboard
          git diff --exit-code -- supabase/dashboard
          test -z "$(git ls-files --others --exclude-standard -- supabase/dashboard)"
      - run: pnpm check
      - run: pnpm run licenses
      - run: pnpm licenses:deno
      - run: pnpm build:desktop
      - name: PostgreSQL ownership and migration checks
        run: bash scripts/sql-test.sh
      - name: Pinned Deno runtime and backend contracts
        run: |
          bash scripts/deno-install.sh
          /tmp/velora-deno/deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
          /tmp/velora-deno/deno test --allow-env --config supabase/functions/deno.json supabase/tests/edge_test.ts
      - name: Scan source and git history for secrets
        run: pnpm secret:scan --history
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm e2e
      - name: Account entry fixtures
        run: pnpm e2e:auth
      - name: Render full viewport matrix
        run: |
          node scripts/auth-test.mjs --build-only
          pnpm --filter @veloradesk/web exec vite preview --outDir dist-auth --host 127.0.0.1 --port 4174 > /tmp/kimpor-auth-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          pnpm --filter @veloradesk/web preview --port 4173 > /tmp/veloradesk-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          pnpm lighthouse
          pnpm shots
          pnpm visual:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            docs/screenshots/contact-*.png
            docs/screenshots/diffs/
            docs/evidence/screenshot-matrix.json
            docs/evidence/visual-comparison.json
            docs/evidence/lighthouse/
          retention-days: 1
          compression-level: 9
