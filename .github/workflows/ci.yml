name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Fast Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:build
      - name: Verify reproducible dashboard deployment bundles
        run: |
          pnpm cloud:dashboard
          git diff --exit-code -- supabase/dashboard
          test -z "$(git ls-files --others --exclude-standard -- supabase/dashboard)"
      - run: pnpm check
      - run: pnpm run licenses
      - run: pnpm licenses:deno
      - name: Scan source and full git history for secrets
        run: pnpm secret:scan --history
      - run: node scripts/auth-test.mjs --build-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ github.sha }}
          path: |
            apps/web/dist/
            apps/web/dist-auth/
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
  backend:
    name: Backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL ownership and migration checks
        run: bash scripts/sql-test.sh
      - name: Pinned Deno runtime and backend contracts
        run: |
          bash scripts/deno-install.sh
          /tmp/velora-deno/deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
          /tmp/velora-deno/deno test --allow-env --config supabase/functions/deno.json supabase/tests/edge_test.ts
  e2e:
    name: Browser behavior
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build-${{ github.sha }}
          path: apps/web
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm e2e
      - name: Account entry fixtures
        run: pnpm exec playwright test --config playwright.auth.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          compression-level: 0
  visual:
    name: Visual shard ${{ matrix.shard }}/3
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      VISUAL_SHARD: ${{ matrix.shard }}/3
      BASE_URL: http://127.0.0.1:4173
      AUTH_BASE_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build-${{ github.sha }}
          path: apps/web
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Serve the exact validated build
        run: |
          pnpm --filter @veloradesk/web preview --port 4173 > /tmp/web-preview.log 2>&1 &
          pnpm --filter @veloradesk/web exec vite preview --outDir dist-auth --host 127.0.0.1 --port 4174 > /tmp/auth-preview.log 2>&1 &
          for port in 4173 4174; do
            for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:$port/ > /dev/null && break; sleep 1; done
            curl --fail --silent http://127.0.0.1:$port/ > /dev/null
          done
      - run: pnpm layout:audit
      - run: pnpm shots
      - name: Lighthouse budgets
        if: matrix.shard == 1
        run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            docs/screenshots/
            docs/evidence/layout-shard-*.json
            docs/evidence/lighthouse/
            test-results/
            playwright-report/
          retention-days: 1
          compression-level: 0
  visual-review:
    name: Complete visual acceptance
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VISUAL_SHARDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: visual-shard-*-${{ github.sha }}
          merge-multiple: true
      - name: Validate all 612 audits and assemble all 510 captures
        run: |
          node scripts/layout-audit.mjs --merge
          node scripts/shots.mjs --merge
      - run: pnpm visual:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reviewed-matrix-evidence
          path: |
            docs/screenshots/contact-*.png
            docs/screenshots/diffs/
            docs/evidence/lime-layout-audit.json
            docs/evidence/screenshot-matrix.json
            docs/evidence/visual-comparison.json
          retention-days: 1
          compression-level: 0
  gate:
    name: Quality
    if: always()
    needs: [quality, backend, e2e, visual, visual-review]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
