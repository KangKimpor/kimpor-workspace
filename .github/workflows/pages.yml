name: Web preview
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:build
      - run: pnpm build && node scripts/pages.mjs
        env:
          BASE_PATH: /kimpor-workspace/
          # Live owner isolation and private Storage passed after migrations 9/10.
          # Keep an explicit false as the deployment switch for local-only builds.
          VITE_SUPABASE_URL: ${{ vars.KIMPOR_CLOUD_READY != 'false' && vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KIMPOR_CLOUD_READY != 'false' && vars.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || 'BDUcFBWQAJcPeiuPcWNoDeLDPee6-gAnXwezubAT437DBU4znP0bgaQz72164Ia3l2gho2K3x_rb3pFifvEfZ_0' }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
