name: Cloud deployment
on:
  workflow_dispatch:
    inputs:
      domain_only:
        description: Update only custom-domain Auth and server origins
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: kimpor-cloud-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nlcpjdokfvawlpzyfytx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Require the configured project
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$SUPABASE_PROJECT_REF" = 'nlcpjdokfvawlpzyfytx'
      - name: Apply reviewed schema and configure the dedicated project
        if: inputs.domain_only != true
        run: node scripts/cloud-management.mjs
      - name: Configure custom domain only
        if: inputs.domain_only == true
        run: node scripts/cloud-management.mjs --domain-only
      - name: Deploy canonical Edge Functions through the official API
        if: inputs.domain_only != true
        run: pnpm dlx supabase@2.120.0 functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --import-map supabase/functions/deno.json
      - name: Verify deployed functions and real maintenance
        if: inputs.domain_only != true
        run: node scripts/cloud-management.mjs --verify
      - name: Verify live authenticated ownership and private Storage
        if: inputs.domain_only != true
        run: node scripts/cloud-live-check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloud-deployment-evidence
          path: |
            docs/evidence/cloud-deployment.json
            docs/evidence/cloud-live.json
          retention-days: 1
