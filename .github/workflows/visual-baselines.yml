name: Visual baselines
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'record-visual-baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:build && pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Capture the CI baseline candidate
        run: |
          node scripts/auth-test.mjs --build-only
          pnpm --filter @veloradesk/web exec vite preview --outDir dist-auth --host 127.0.0.1 --port 4174 > /tmp/kimpor-auth-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          pnpm --filter @veloradesk/web preview --port 4173 > /tmp/veloradesk-preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          pnpm shots
          pnpm visual:record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baseline-candidate
          path: |
            docs/visual-baselines/
            docs/screenshots/contact-*.png
          retention-days: 1
          compression-level: 9
