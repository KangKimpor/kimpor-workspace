name: Encrypted backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKUP_SOURCE_URL: ${{ secrets.BACKUP_SOURCE_URL }}
      BACKUP_SECRET: ${{ secrets.BACKUP_SECRET }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Explain missing configuration
        if: env.BACKUP_SOURCE_URL == '' || env.BACKUP_SECRET == '' || env.BACKUP_ENCRYPTION_KEY == ''
        run: echo '::notice::Scheduled backup is unconfigured. Use Settings → Export full ZIP until cloud secrets are configured.'
      - name: Export and encrypt before writing an artifact
        if: env.BACKUP_SOURCE_URL != '' && env.BACKUP_SECRET != '' && env.BACKUP_ENCRYPTION_KEY != ''
        run: node scripts/cloud-backup.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && env.BACKUP_SOURCE_URL != '' && env.BACKUP_SECRET != '' && env.BACKUP_ENCRYPTION_KEY != ''
        with:
          name: encrypted-workspace-backup
          path: backup/workspace.enc
          retention-days: 7
          compression-level: 0
