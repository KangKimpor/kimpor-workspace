name: Cloud health
on:
  workflow_dispatch:
  schedule:
    - cron: '11 5 * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
      MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Explain missing configuration
        if: env.KEEPALIVE_URL == '' || env.MAINTENANCE_SECRET == ''
        run: echo '::notice::Cloud health schedule is unconfigured; local workspaces remain available.'
      - name: Check configured database
        if: env.KEEPALIVE_URL != '' && env.MAINTENANCE_SECRET != ''
        run: node scripts/cloud-health.mjs
