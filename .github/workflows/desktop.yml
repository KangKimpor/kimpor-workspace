name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-desktop')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: rustup default 1.99.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:build
      - run: pnpm licenses:cargo
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: ./scripts/windows-process-tree.test.ps1
      - name: Build per-user NSIS installer and signed updater on tags
        id: build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # Main builds are development fixtures for native UI/RAM verification.
          # Tagged builds require the real account configuration and readiness.
          VITE_SUPABASE_URL: ${{ startsWith(github.ref, 'refs/tags/v') && vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || 'BDUcFBWQAJcPeiuPcWNoDeLDPee6-gAnXwezubAT437DBU4znP0bgaQz72164Ia3l2gho2K3x_rb3pFifvEfZ_0' }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          KIMPOR_CLOUD_READY: ${{ vars.KIMPOR_CLOUD_READY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if ($env:IS_RELEASE -eq 'true') {
            node scripts/account-release-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Account release prerequisites are incomplete.' }
            if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'A release requires the backed-up TAURI_SIGNING_PRIVATE_KEY repository secret.' }
            $version = $env:RELEASE_TAG -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Release tag must contain a semantic version.' }
            $config = Join-Path $env:RUNNER_TEMP 'veloradesk-release.json'
            @{ version = $version; bundle = @{ createUpdaterArtifacts = $true } } | ConvertTo-Json -Depth 5 | Set-Content $config
            pnpm --filter @veloradesk/desktop build --config $config -- --locked
          } else {
            pnpm --filter @veloradesk/desktop build -- --locked
          }
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed.' }
      - name: Install, window and single-instance smoke checks
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Installer budget, checksums and update feed
        id: bundle
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./scripts/windows-release.ps1
      - name: Preserve Windows verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Kimpor Workspace-windows-verification
          path: |
            docs/evidence/windows-smoke.json
            docs/evidence/windows-ui.json
            docs/evidence/windows-ui.png
            docs/evidence/windows-native-window.png
            docs/evidence/windows-webview-diagnostics.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.build.outcome == 'success' && steps.bundle.outcome == 'success'
        with:
          name: Kimpor Workspace-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            docs/evidence/windows-smoke.json
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Kimpor Workspace-windows-x64
          path: release
      - name: Publish release with signed update feed
        run: |
          feed=$(find release -name latest.json -type f -print -quit)
          test -n "$feed"
          bundle=$(dirname "$feed")
          gh release create "$RELEASE_TAG" "$bundle"/* --repo "$REPOSITORY" --title "Kimpor Workspace $RELEASE_TAG" --notes "Local-first workspace. Windows installer is unsigned for Authenticode; SmartScreen may show a warning. The in-app update package has a verified Tauri updater signature. See the release evidence and device checklist for remaining verification."
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
