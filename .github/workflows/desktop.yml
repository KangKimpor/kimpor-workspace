name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-desktop')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:build
      - run: pnpm licenses:cargo
      - name: Build unsigned per-user NSIS installer
        run: pnpm --filter @veloradesk/desktop build -- --locked
      - name: Install, window and single-instance smoke checks
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Check installer size and SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($installer.Length -gt 20MB) { throw "Installer exceeds 20 MiB budget" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.Directory)/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VeloraDesk-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VeloraDesk-windows-x64
          path: release
      - run: gh release create "$RELEASE_TAG" release/* --repo "$REPOSITORY" --prerelease --title "VeloraDesk $RELEASE_TAG — Foundation preview" --notes "Phase 0 foundation preview. Unsigned Windows installer; SmartScreen may warn. Product modules and cloud sign-in are not implemented. See the Phase 0 report for verification and gaps."
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
